name: Deploy test races to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deployment at a time; let in-flight deploys finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  race:
    name: Run test races
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # postinstall runs `playwright install chromium`
      - name: Install dependencies
        run: npm ci

      - name: Run all test races
        run: |
          failed=0
          for dir in races/*/; do
            name=$(basename "$dir")
            echo "::group::🏁 Racing: $name"
            if ! node race.js "$dir" --headless --serve=0 --wasm=0; then
              echo "::warning::Race '$name' failed — it will be missing from the site"
              failed=$((failed + 1))
            fi
            echo "::endgroup::"
          done
          echo "$failed race(s) failed"

      - name: Build Pages site
        run: node scripts/build-pages.js --out=site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: race
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
