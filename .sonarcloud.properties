# SonarCloud Automatic Analysis configuration.
#
# Automatic Analysis reads .sonarcloud.properties; sonar-project.properties is
# only read by CI-based scanners. This mirrors sonar-project.properties:
# duplication detection is scoped to production source only. Test code is
# intentionally repetitive — fixture setup and arrange/act/assert blocks recur
# by design — so copy-paste detection there produces noise, not signal.
sonar.cpd.exclusions=tests/**,integration/**,**/*.test.js
