# SonarCloud analysis configuration.
#
# Duplication detection is scoped to production source only. Test code is
# intentionally repetitive — fixture setup and arrange/act/assert blocks recur
# by design — so copy-paste detection there produces noise, not signal. The
# production source carries no duplication (verified with jscpd), and excluding
# tests keeps the "Duplication on New Code" metric meaningful.
sonar.cpd.exclusions=tests/**,integration/**,**/*.test.js
