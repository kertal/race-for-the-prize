<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Race for the Prize</title>
  <style>
    :root {
      --bg: #0f1117;
      --bg-card: #1a1d27;
      --bg-hover: #222633;
      --border: #2a2e3d;
      --text: #e1e4ed;
      --text-dim: #8b90a0;
      --accent: #f0c040;
      --green: #4ade80;
      --red: #f87171;
      --blue: #60a5fa;
      --purple: #a78bfa;
      --cyan: #22d3ee;
      --orange: #fb923c;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    .header {
      padding: 24px 32px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .header h1 {
      font-size: 20px;
      font-weight: 600;
      cursor: pointer;
    }

    .header h1:hover { color: var(--accent); }

    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-dim);
      font-size: 14px;
    }

    .breadcrumb a {
      color: var(--text-dim);
      text-decoration: none;
    }

    .breadcrumb a:hover { color: var(--text); }
    .breadcrumb .sep { color: var(--border); }

    .container { max-width: 1200px; margin: 0 auto; padding: 24px 32px; }

    /* Race list */
    .race-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 16px;
    }

    .race-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .race-card:hover {
      background: var(--bg-hover);
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .race-card h3 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .race-card .racers {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .tag {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 500;
    }

    .tag-racer { background: #1e3a5f; color: var(--blue); }
    .tag-results { background: #1a2e1a; color: var(--green); font-size: 11px; }
    .tag-setting { background: #2d2318; color: var(--orange); font-size: 11px; }

    .race-card .meta {
      color: var(--text-dim);
      font-size: 13px;
    }

    /* Race detail */
    .detail-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .detail-header h2 { font-size: 24px; }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 18px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg-card);
      color: var(--text);
      font-size: 14px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn:hover { background: var(--bg-hover); border-color: var(--text-dim); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-primary {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
      font-weight: 600;
    }

    .btn-primary:hover { background: #e6b430; }

    /* Scripts */
    .scripts-section { margin-bottom: 32px; }

    .scripts-section h3 {
      font-size: 16px;
      margin-bottom: 12px;
      color: var(--text-dim);
    }

    .script-tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 0;
    }

    .script-tab {
      padding: 6px 16px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-bottom: none;
      border-radius: 8px 8px 0 0;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 13px;
    }

    .script-tab.active {
      background: var(--bg-card);
      color: var(--text);
      border-color: var(--border);
    }

    .script-content {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 0 8px 8px 8px;
      padding: 16px;
      overflow-x: auto;
    }

    .script-content pre {
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
      font-size: 13px;
      line-height: 1.6;
      white-space: pre;
      color: var(--text);
    }

    /* Settings panel */
    .settings-panel {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 24px;
    }

    .settings-panel h4 {
      font-size: 13px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }

    .settings-grid {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }

    .setting-item {
      font-size: 13px;
    }

    .setting-item .key { color: var(--text-dim); }
    .setting-item .val { color: var(--text); font-weight: 500; }

    /* Results list */
    .results-section h3 {
      font-size: 16px;
      margin-bottom: 16px;
      color: var(--text-dim);
    }

    .result-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 12px;
      overflow: hidden;
    }

    .result-header {
      padding: 16px 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: background 0.15s;
    }

    .result-header:hover { background: var(--bg-hover); }

    .result-header .timestamp { font-weight: 500; }

    .result-header .winner {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
    }

    .result-header .winner .trophy { font-size: 16px; }

    .result-body {
      display: none;
      padding: 0 20px 20px;
      border-top: 1px solid var(--border);
    }

    .result-body.open { display: block; padding-top: 16px; }

    /* Comparison bars */
    .comparison {
      margin-bottom: 20px;
    }

    .comparison .comp-name {
      font-size: 13px;
      color: var(--text-dim);
      margin-bottom: 8px;
    }

    .bar-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 4px;
    }

    .bar-label {
      width: 100px;
      font-size: 13px;
      font-weight: 500;
      text-align: right;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .bar-track {
      flex: 1;
      height: 24px;
      background: var(--bg);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }

    .bar-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.3s ease;
      min-width: 2px;
    }

    .bar-value {
      width: 80px;
      font-size: 13px;
      font-family: 'SF Mono', monospace;
      text-align: right;
    }

    .bar-badge {
      font-size: 14px;
      width: 24px;
      text-align: center;
    }

    /* Videos */
    .videos-section {
      margin-top: 20px;
    }

    .videos-section h4 {
      font-size: 13px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 12px;
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 16px;
    }

    .video-item {
      background: var(--bg);
      border-radius: 8px;
      overflow: hidden;
    }

    .video-item video {
      width: 100%;
      display: block;
    }

    .video-item .video-label {
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 500;
    }

    /* Raw data */
    .raw-data-section { margin-top: 16px; }

    .raw-toggle {
      font-size: 13px;
      color: var(--text-dim);
      cursor: pointer;
      user-select: none;
    }

    .raw-toggle:hover { color: var(--text); }

    .raw-content {
      display: none;
      margin-top: 8px;
      background: var(--bg);
      border-radius: 8px;
      padding: 16px;
      overflow-x: auto;
      max-height: 400px;
      overflow-y: auto;
    }

    .raw-content.open { display: block; }

    .raw-content pre {
      font-family: 'SF Mono', monospace;
      font-size: 12px;
      line-height: 1.5;
      color: var(--text-dim);
    }

    /* Run dialog */
    .run-status {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 24px;
    }

    .run-status .status-line {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
    }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .run-output {
      margin-top: 12px;
      background: var(--bg);
      border-radius: 8px;
      padding: 12px;
      max-height: 200px;
      overflow-y: auto;
      font-family: 'SF Mono', monospace;
      font-size: 12px;
      line-height: 1.5;
      color: var(--text-dim);
      white-space: pre-wrap;
      word-break: break-all;
    }

    /* Machine info */
    .machine-info {
      margin-top: 16px;
      font-size: 12px;
      color: var(--text-dim);
    }

    .machine-info span { margin-right: 16px; }

    /* No results */
    .empty-state {
      text-align: center;
      padding: 48px 24px;
      color: var(--text-dim);
    }

    .empty-state .icon { font-size: 48px; margin-bottom: 16px; }
    .empty-state p { font-size: 15px; margin-bottom: 16px; }

    /* Run options */
    .run-options {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 16px;
    }

    .run-options label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--text-dim);
      cursor: pointer;
    }

    .run-options input[type="checkbox"] { accent-color: var(--accent); }
    .run-options input[type="number"],
    .run-options select {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 13px;
      width: 80px;
    }

    /* Responsive */
    @media (max-width: 600px) {
      .header { padding: 16px; }
      .container { padding: 16px; }
      .race-grid { grid-template-columns: 1fr; }
      .detail-header { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1 onclick="navigateTo('list')">Race for the Prize</h1>
    <div class="breadcrumb" id="breadcrumb"></div>
  </div>
  <div class="container" id="app"></div>

  <script>
    const RACER_COLORS = ['#60a5fa', '#f87171', '#4ade80', '#a78bfa', '#fb923c'];
    let currentView = 'list';
    let currentRace = null;
    let pollingTimer = null;

    // --- Navigation ---

    function navigateTo(view, race = null) {
      currentView = view;
      currentRace = race;
      if (pollingTimer) { clearInterval(pollingTimer); pollingTimer = null; }
      render();
      window.history.pushState({ view, race }, '', view === 'list' ? '/' : `#${race}`);
    }

    window.addEventListener('popstate', (e) => {
      if (e.state) {
        currentView = e.state.view;
        currentRace = e.state.race;
      } else {
        currentView = 'list';
        currentRace = null;
      }
      render();
    });

    // Init from hash
    if (window.location.hash) {
      currentView = 'detail';
      currentRace = window.location.hash.slice(1);
    }

    // --- API ---

    async function api(path, options = {}) {
      const res = await fetch(`/api/${path}`, options);
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        throw new Error(body.error || `HTTP ${res.status}`);
      }
      return res.json();
    }

    // --- Render ---

    async function render() {
      const app = document.getElementById('app');
      const bc = document.getElementById('breadcrumb');

      try {
        if (currentView === 'list') {
          bc.innerHTML = '';
          app.innerHTML = '<div style="text-align:center;padding:48px;color:var(--text-dim)">Loading...</div>';
          const data = await api('races');
          renderRaceList(app, data.races);
        } else if (currentView === 'detail' && currentRace) {
          bc.innerHTML = `<a href="#" onclick="event.preventDefault();navigateTo('list')">Races</a><span class="sep">/</span><span>${escapeHtml(currentRace)}</span>`;
          app.innerHTML = '<div style="text-align:center;padding:48px;color:var(--text-dim)">Loading...</div>';
          const data = await api(`races/${encodeURIComponent(currentRace)}`);
          renderRaceDetail(app, data);
        }
      } catch (err) {
        app.innerHTML = `<div class="empty-state"><div class="icon">⚠</div><p>${escapeHtml(err.message)}</p></div>`;
      }
    }

    function renderRaceList(app, races) {
      if (!races || races.length === 0) {
        app.innerHTML = `<div class="empty-state"><div class="icon">🏎</div><p>No races found in the races/ directory.</p></div>`;
        return;
      }

      let html = '<div class="race-grid">';
      for (const race of races) {
        const settingsTags = race.settings
          ? Object.entries(race.settings).map(([k, v]) => `<span class="tag tag-setting">${escapeHtml(k)}: ${escapeHtml(String(v))}</span>`).join('')
          : '';
        html += `
          <div class="race-card" onclick="navigateTo('detail', '${escapeAttr(race.name)}')">
            <h3>${escapeHtml(formatRaceName(race.name))}</h3>
            <div class="racers">
              ${race.racerNames.map(n => `<span class="tag tag-racer">${escapeHtml(n)}</span>`).join('')}
            </div>
            <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px">
              ${settingsTags}
              ${race.resultCount > 0 ? `<span class="tag tag-results">${race.resultCount} result${race.resultCount !== 1 ? 's' : ''}</span>` : ''}
            </div>
          </div>`;
      }
      html += '</div>';
      app.innerHTML = html;
    }

    function renderRaceDetail(app, data) {
      if (data.error) {
        app.innerHTML = `<div class="empty-state"><div class="icon">🚫</div><p>${data.error}</p></div>`;
        return;
      }

      let html = '';

      // Header with run button
      html += `<div class="detail-header">
        <h2>${escapeHtml(formatRaceName(data.name))}</h2>
        <button class="btn btn-primary" id="run-btn" onclick="startRace('${escapeAttr(data.name)}')">Run Race</button>
      </div>`;

      // Run status area
      html += '<div id="run-status"></div>';

      // Run options
      html += `<div class="run-options" id="run-options">
        <label><input type="checkbox" id="opt-parallel"> Parallel</label>
        <label><input type="checkbox" id="opt-headless" checked> Headless</label>
        <label><input type="checkbox" id="opt-no-recording"> No Recording</label>
        <label>Runs: <input type="number" id="opt-runs" value="1" min="1" max="20"></label>
        <label>Network: <select id="opt-network">
          <option value="">none</option>
          <option value="slow-3g">slow-3g</option>
          <option value="fast-3g">fast-3g</option>
          <option value="4g">4g</option>
        </select></label>
        <label>CPU: <input type="number" id="opt-cpu" value="1" min="1" max="20"></label>
      </div>`;

      // Settings
      if (data.settings) {
        html += `<div class="settings-panel">
          <h4>Default Settings</h4>
          <div class="settings-grid">
            ${Object.entries(data.settings).map(([k, v]) =>
              `<div class="setting-item"><span class="key">${escapeHtml(k)}:</span> <span class="val">${escapeHtml(String(v))}</span></div>`
            ).join('')}
          </div>
        </div>`;
      }

      // Racer scripts
      if (data.racerScripts && Object.keys(data.racerScripts).length > 0) {
        const names = Object.keys(data.racerScripts);
        html += `<div class="scripts-section">
          <h3>Racer Scripts</h3>
          <div class="script-tabs">
            ${names.map((n, i) => `<div class="script-tab${i === 0 ? ' active' : ''}" onclick="switchTab(this, '${escapeAttr(n)}')">${escapeHtml(n)}</div>`).join('')}
          </div>
          <div class="script-content">
            ${names.map((n, i) => `<pre id="script-${n}" style="${i > 0 ? 'display:none' : ''}">${escapeHtml(data.racerScripts[n])}</pre>`).join('')}
          </div>
        </div>`;
      }

      // Results
      html += '<div class="results-section">';
      html += `<h3>Results (${data.results.length})</h3>`;

      if (data.results.length === 0) {
        html += '<div class="empty-state"><div class="icon">📊</div><p>No results yet. Run a race to see results here.</p></div>';
      } else {
        for (const result of data.results) {
          html += renderResultCard(data.name, result);
        }
      }

      html += '</div>';
      app.innerHTML = html;
    }

    function renderResultCard(raceName, result) {
      const { dir, summary } = result;
      const id = dir.replace(/[^a-zA-Z0-9-]/g, '_');

      if (!summary) {
        return `<div class="result-card">
          <div class="result-header"><span class="timestamp">${formatResultDir(dir)}</span><span style="color:var(--text-dim)">No summary</span></div>
        </div>`;
      }

      const winner = summary.overallWinner;
      const racers = summary.racers || [];

      let body = '';

      // Comparisons
      if (summary.comparisons && summary.comparisons.length > 0) {
        for (const comp of summary.comparisons) {
          const maxDur = Math.max(...comp.racers.map(r => r?.duration || 0));
          body += `<div class="comparison"><div class="comp-name">${escapeHtml(comp.name)}</div>`;
          for (let i = 0; i < racers.length; i++) {
            const r = comp.racers[i];
            const dur = r?.duration || 0;
            const pct = maxDur > 0 ? (dur / maxDur * 100) : 0;
            const color = RACER_COLORS[i % RACER_COLORS.length];
            const isWinner = comp.winner === racers[i];
            body += `<div class="bar-row">
              <div class="bar-label" style="color:${color}">${escapeHtml(racers[i])}</div>
              <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${color}"></div></div>
              <div class="bar-value">${dur ? dur.toFixed(3) + 's' : 'N/A'}</div>
              <div class="bar-badge">${isWinner ? '🏆' : ''}</div>
            </div>`;
          }
          body += '</div>';
        }
      }

      // Videos
      if (summary.videos) {
        const videoEntries = racers.filter(name => summary.videos[name]).map(name => ({
          name,
          path: summary.videos[name]
        }));

        if (videoEntries.length > 0) {
          body += `<div class="videos-section"><h4>Recordings</h4><div class="video-grid">`;
          for (const v of videoEntries) {
            const videoUrl = `/api/races/${raceName}/results/${dir}/files/${v.path}`;
            body += `<div class="video-item">
              <video controls preload="metadata" src="${escapeAttr(videoUrl)}"></video>
              <div class="video-label">${escapeHtml(v.name)}</div>
            </div>`;
          }
          body += '</div></div>';
        }
      }

      // Machine info
      if (summary.machineInfo) {
        const mi = summary.machineInfo;
        body += `<div class="machine-info">
          <span>${escapeHtml((mi.platform || '') + ' ' + (mi.arch || ''))}</span>
          <span>${escapeHtml(mi.cpuModel || '')}</span>
          <span>${escapeHtml(String(mi.cpuCores || '?'))} cores</span>
          <span>${mi.totalMemoryMB ? Math.round(mi.totalMemoryMB / 1024) + ' GB RAM' : ''}</span>
          <span>Node ${escapeHtml(mi.nodeVersion || '?')}</span>
        </div>`;
      }

      // Raw JSON toggle
      body += `<div class="raw-data-section">
        <div class="raw-toggle" onclick="toggleRaw('${escapeAttr(id)}')">▸ Raw summary.json</div>
        <div class="raw-content" id="raw-${escapeAttr(id)}"><pre>${escapeHtml(JSON.stringify(summary, null, 2))}</pre></div>
      </div>`;

      return `<div class="result-card">
        <div class="result-header" onclick="toggleResult('${escapeAttr(id)}')">
          <span class="timestamp">${escapeHtml(formatResultDir(dir))}</span>
          <span class="winner">${winner ? `<span class="trophy">🏆</span> ${escapeHtml(winner)}` : '<span style="color:var(--text-dim)">No winner</span>'}</span>
        </div>
        <div class="result-body" id="result-${escapeAttr(id)}">${body}</div>
      </div>`;
    }

    // --- Actions ---

    async function startRace(name) {
      const btn = document.getElementById('run-btn');
      btn.disabled = true;
      btn.textContent = 'Starting...';

      const opts = {};
      if (document.getElementById('opt-parallel')?.checked) opts.parallel = true;
      opts.headless = document.getElementById('opt-headless')?.checked !== false;
      if (document.getElementById('opt-no-recording')?.checked) opts.noRecording = true;
      const runs = parseInt(document.getElementById('opt-runs')?.value || '1', 10);
      if (runs > 1) opts.runs = runs;
      const network = document.getElementById('opt-network')?.value;
      if (network) opts.network = network;
      const cpu = parseInt(document.getElementById('opt-cpu')?.value || '1', 10);
      if (cpu > 1) opts.cpu = cpu;

      try {
        const data = await api(`races/${encodeURIComponent(name)}/run`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(opts),
        });

        if (data.error) {
          showRunStatus('error', data.error);
          btn.disabled = false;
          btn.textContent = 'Run Race';
          return;
        }

        showRunStatus('running', 'Race is running...');

        // Poll for status
        pollingTimer = setInterval(async () => {
          try {
            const status = await api(`races/status/${data.raceId}`);
            const outputEl = document.getElementById('run-output');
            if (outputEl) {
              outputEl.textContent = status.output || '';
              outputEl.scrollTop = outputEl.scrollHeight;
            }

            if (status.status !== 'running') {
              clearInterval(pollingTimer);
              pollingTimer = null;

              if (status.status === 'completed') {
                showRunStatus('success', 'Race completed! Refreshing results...');
              } else {
                showRunStatus('error', 'Race failed. Check output below.');
              }

              btn.disabled = false;
              btn.textContent = 'Run Race';

              // Refresh the detail view
              setTimeout(() => navigateTo('detail', name), 1500);
            }
          } catch {
            // Ignore transient fetch errors during polling
          }
        }, 2000);
      } catch (err) {
        showRunStatus('error', `Failed to start race: ${err.message}`);
        btn.disabled = false;
        btn.textContent = 'Run Race';
      }
    }

    function showRunStatus(type, message) {
      const el = document.getElementById('run-status');
      if (!el) return;

      const icon = type === 'running' ? '<span class="spinner"></span>'
        : type === 'success' ? '✅'
        : '❌';

      el.innerHTML = `<div class="run-status">
        <div class="status-line">${icon} ${escapeHtml(message)}</div>
        ${type === 'running' ? '<div class="run-output" id="run-output"></div>' : ''}
      </div>`;
    }

    // --- UI helpers ---

    function toggleResult(id) {
      const el = document.getElementById('result-' + id);
      if (el) el.classList.toggle('open');
    }

    function toggleRaw(id) {
      const el = document.getElementById('raw-' + id);
      if (el) {
        el.classList.toggle('open');
        const toggle = el.previousElementSibling;
        if (toggle) toggle.textContent = el.classList.contains('open') ? '▾ Raw summary.json' : '▸ Raw summary.json';
      }
    }

    function switchTab(tabEl, name) {
      const tabs = tabEl.parentElement.children;
      const container = tabEl.parentElement.nextElementSibling;
      for (const t of tabs) t.classList.remove('active');
      tabEl.classList.add('active');
      for (const pre of container.children) pre.style.display = 'none';
      const target = document.getElementById('script-' + name);
      if (target) target.style.display = '';
    }

    function formatRaceName(name) {
      return name.replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
    }

    function formatResultDir(dir) {
      const m = dir.match(/^results-(\d{4})-(\d{2})-(\d{2})_(\d{2})-(\d{2})-(\d{2})$/);
      if (m) {
        return `${m[1]}-${m[2]}-${m[3]} ${m[4]}:${m[5]}:${m[6]}`;
      }
      return dir;
    }

    function escapeHtml(str) {
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    /** Escape a value for use inside an HTML attribute (single or double quoted). */
    function escapeAttr(str) {
      return escapeHtml(str);
    }

    // --- Init ---
    render();
  </script>
</body>
</html>
